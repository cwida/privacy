#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@ebdcc1961780b0ce1272a0d7637dc58447c34885
    with:
      duckdb_version: v2.0.0
      ci_tools_version: ebdcc1961780b0ce1272a0d7637dc58447c34885
      extension_name: privacy
      # Temporary Windows diagnosis: retain the native test output on a crash.
      exclude_archs: 'linux_amd64;linux_arm64;osx_arm64;windows_amd64_mingw;wasm_eh;wasm_mvp;wasm_threads'
      test_config: '{"test_env_variables": {"TEST_RUNNER_SCRIPT": ".ci/use-native-test-runner", "T": "\"test/*\""}}'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@ebdcc1961780b0ce1272a0d7637dc58447c34885
    with:
      duckdb_version: v2.0.0
      ci_tools_version: ebdcc1961780b0ce1272a0d7637dc58447c34885
      extension_name: privacy
      format_checks: 'format;tidy'
