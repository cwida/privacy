name: Code Quality

on:
  workflow_call:

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format Check
            runner: ubuntu-22.04
            apt_packages: ninja-build clang-format-11
            pip_packages: cmake-format 'black==24.*' cxxheaderparser pcpp 'clang_format==11.0.1'
            pip_flags: ''
            target: format-check
          - name: Tidy Check
            runner: ubuntu-24.04
            apt_packages: ninja-build clang-tidy
            pip_packages: '"pybind11[global]"'
            pip_flags: --break-system-packages
            target: tidy-check
    env:
      CC: gcc
      CXX: g++
      GEN: ninja
      TIDY_THREADS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install check dependencies
        shell: bash
        run: |
          # The hosted image's Azure mirror has repeatedly failed DNS lookup.
          # Keep Ubuntu's signed packages, using its official archive directly.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 update -y -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq ${{ matrix.apt_packages }}
          sudo pip3 install ${{ matrix.pip_packages }} ${{ matrix.pip_flags }}

      - name: Run check
        run: make ${{ matrix.target }}
