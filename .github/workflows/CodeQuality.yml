name: Code Quality

on:
  workflow_call:

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format Check
            runner: ubuntu-22.04
            pip_packages: cmake-format 'black==24.*' cxxheaderparser pcpp 'clang_format==11.0.1'
            pip_flags: ''
            tidy_binary: ''
            target: format-check
          - name: Tidy Check
            runner: ubuntu-24.04
            pip_packages: '"pybind11[global]"'
            pip_flags: --break-system-packages
            tidy_binary: clang-tidy-18
            target: tidy-check
    env:
      CC: gcc
      CXX: g++
      GEN: ninja
      TIDY_THREADS: 4
      TIDY_BINARY: ${{ matrix.tidy_binary }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Python check tools
        shell: bash
        run: |
          # Ninja and clang-tidy-18 are already on the hosted Ubuntu image.
          # Avoid redundant apt installs that fail on the image's package mirrors.
          sudo pip3 install ${{ matrix.pip_packages }} ${{ matrix.pip_flags }}

      - name: Run check
        run: |
          if [ '${{ matrix.target }}' = 'tidy-check' ]; then
            ninja --version
            "$TIDY_BINARY" --version
          fi
          make ${{ matrix.target }}
